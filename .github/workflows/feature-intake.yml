name: Feature Request Intake

on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions: {}

env:
  # Keep this CLI compatible with the protocol version in the locked Copilot SDK.
  AGENT_LOOP_DISABLE_CLI_AUTO_UPDATE: '1'
  AGENT_LOOP_COPILOT_PACKAGE: '@github/copilot-linux-x64@1.0.106'

jobs:
  triage:
    if: >-
      startsWith(github.event.issue.title, 'Feature-Request: SPE VSC Extension -') &&
      github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: feature-agent
    concurrency:
      group: feature-readiness-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Read issue and check for an existing review
        id: readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/agent-loop/review-feature.mjs prepare
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        id: reviewer-node
        if: steps.readiness.outputs.kind == 'model'
        continue-on-error: true
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare the text-only readiness reviewer
        id: setup-reviewer
        if: steps.reviewer-node.outcome == 'success'
        continue-on-error: true
        run: |
          npm ci --ignore-scripts
          npm run agent:build
          npm install --global "$AGENT_LOOP_COPILOT_PACKAGE"
          printf 'AGENT_LOOP_COPILOT_COMMAND=%s\n' "$(command -v copilot-linux-x64)" >> "$GITHUB_ENV"
      - name: Review the public requirement brief
        if: steps.setup-reviewer.outcome == 'success'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          AGENT_LOOP_MODEL: ${{ vars.AGENT_LOOP_MODEL || 'gpt-6.2-sol' }}
        run: node tools/agent-loop/review-feature.mjs review
      - name: Update the readiness comment and needs-info label
        if: steps.readiness.outputs.kind != 'ignored'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/agent-loop/review-feature.mjs publish

  report-progress:
    if: >-
      startsWith(github.event.issue.title, 'Feature-Request: SPE VSC Extension -') &&
      github.event.action == 'labeled' && github.event.label.name == 'agent-ready' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Clear human review status and show implementation progress
        env:
          GH_TOKEN: ${{ github.token }}
          FEATURE_REQUEST_APPROVERS: ${{ vars.FEATURE_REQUEST_APPROVERS }}
        run: node tools/agent-loop/feature-handoff.mjs watch

  implement:
    if: >-
      startsWith(github.event.issue.title, 'Feature-Request: SPE VSC Extension -') &&
      github.event.action == 'labeled' && github.event.label.name == 'agent-ready' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: feature-agent-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
    environment: feature-agent
    outputs:
      approved: ${{ steps.intake.outputs.approved }}
      reviewed-tree: ${{ steps.agent.outputs.reviewed-tree }}
      agent-stage: ${{ steps.agent.outputs.stage }}
      worker-retries: ${{ steps.agent.outputs.worker-retries }}
      offline-plans: ${{ steps.agent.outputs.offline-plans }}
      agent-diagnostic: ${{ steps.agent.outputs.diagnostic }}
      artifact-id: ${{ steps.review.outputs.artifact-id }}
      review-files: ${{ steps.agent.outputs.review-files }}
      vsix-url: ${{ steps.vsix.outputs.artifact-url }}
      vsix-id: ${{ steps.vsix.outputs.artifact-id }}
      ux-screenshot-id: ${{ steps.ux-screenshot.outputs.artifact-id }}
    env:
      FEATURE_REQUEST_APPROVERS: ${{ vars.FEATURE_REQUEST_APPROVERS }}
      AGENT_LOOP_MODEL: ${{ vars.AGENT_LOOP_MODEL || 'gpt-6.2-sol' }}
      AGENT_LOOP_REASONING_EFFORT: ${{ vars.AGENT_LOOP_REASONING_EFFORT }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authorize issue and compile its task contract
        id: intake
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/agent-loop/feature-issue.mjs authorize
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.intake.outputs.approved == 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare the locked project dependencies, Copilot CLI and validation image
        if: steps.intake.outputs.approved == 'true'
        run: |
          playwright_version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          if [[ "$playwright_version" != '1.61.1' ]]; then
            echo '::error::Update the validation image pin to match the Playwright lockfile.'
            exit 1
          fi
          image="mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48"
          # Pull while npm prepares the runner, not after the build.
          docker pull "$image" &
          pull_pid=$!
          trap 'kill "$pull_pid" 2>/dev/null || true' EXIT
          cache="$RUNNER_TEMP/feature-npm-cache"
          npm ci --ignore-scripts --cache "$cache" --no-audit --no-fund
          npm ci --prefix webview-ui --ignore-scripts --cache "$cache" --no-audit --no-fund
          chmod -R a+rX "$cache"
          printf 'AGENT_LOOP_NPM_CACHE=%s\n' "$cache" >> "$GITHUB_ENV"
          npm run agent:build
          npm install --global "$AGENT_LOOP_COPILOT_PACKAGE"
          printf 'AGENT_LOOP_COPILOT_COMMAND=%s\n' "$(command -v copilot-linux-x64)" >> "$GITHUB_ENV"
          desktop="$RUNNER_TEMP/feature-desktop-vscode"
          if node -e 'require("@vscode/test-electron").downloadAndUnzipVSCode({
            cachePath: process.argv[1], version: "1.106.3", platform: "linux-x64"
          }).catch(error => { console.error(error.message); process.exitCode = 1; })' "$desktop"; then
            test -x "$desktop/vscode-linux-x64-1.106.3/code"
            printf 'AGENT_LOOP_DESKTOP_VSCODE=%s\n' "$desktop/vscode-linux-x64-1.106.3" >> "$GITHUB_ENV"
          else
            echo '::warning::Desktop VS Code is unavailable. Webview validation can still run.'
          fi
          wait "$pull_pid"
          trap - EXIT
          docker image inspect --format 'AGENT_LOOP_VALIDATION_IMAGE={{.Id}}' "$image" >> "$GITHUB_ENV"
          git config user.name "SPE Feature Agent"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Recheck approval before implementation
        id: start
        if: steps.intake.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/agent-loop/feature-issue.mjs confirm
      - name: Run the agent loop and export the reviewed diff
        id: agent
        if: steps.start.outputs.approved == 'true'
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [[ -z "$COPILOT_GITHUB_TOKEN" ]]; then
            echo '::error::Configure COPILOT_GITHUB_TOKEN in the feature-agent environment.'
            exit 1
          fi
          if [[ ! "${AGENT_LOOP_VALIDATION_IMAGE:-}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo '::error::The isolated validation image is unavailable.'
            exit 1
          fi
          result="$RUNNER_TEMP/feature-agent-result.json"
          diagnostics=$(mktemp "$RUNNER_TEMP/feature-agent-diagnostics.XXXXXX")
          export AGENT_LOOP_UX_EVIDENCE_ROOT
          AGENT_LOOP_UX_EVIDENCE_ROOT=$(mktemp -d "$RUNNER_TEMP/feature-ux.XXXXXX")
          agent_status=0
          AGENT_LOOP_DIAGNOSTICS_FILE="$diagnostics" node tools/agent-loop/dist/cli.js run-feature \
            .agent-runs/github-intake-contract.json > "$result" 2> "$RUNNER_TEMP/feature-agent-errors.log" || agent_status=$?
          worker_retries=0
          offline_plans=0
          diagnostic=''
          while IFS= read -r line; do
            printf '%s\n' "$line"
            case "$line" in
              'Feature agent stage: contract'|'Feature agent stage: copilot-preflight'|'Feature agent stage: implementation'|'Feature agent stage: integration'|'Feature agent stage: validation'|'Feature agent stage: review'|'Feature agent stage: repass')
                printf 'stage=%s\n' "${line#Feature agent stage: }" >> "$GITHUB_OUTPUT"
                ;;
              'Feature agent retrying worker: implementer'|'Feature agent retrying worker: sdet')
                worker_retries=$((worker_retries + 1))
                ;;
              'Feature agent trying offline alternative: implementer'|'Feature agent trying offline alternative: sdet')
                offline_plans=$((offline_plans + 1))
                ;;
              'Feature agent stopped during '*|'Feature agent blocked: '*)
                diagnostic="$line"
                ;;
            esac
          done < "$diagnostics"
          printf 'worker-retries=%s\noffline-plans=%s\n' "$worker_retries" "$offline_plans" >> "$GITHUB_OUTPUT"
          if (( agent_status != 0 )); then
            if [[ -z "$diagnostic" ]]; then
              diagnostic="The runner exited with status $agent_status without recording a diagnostic. Check the job timing and runner termination before retrying."
            fi
            printf 'diagnostic=%s\n' "$diagnostic" >> "$GITHUB_OUTPUT"
            printf '::error title=Feature agent stopped::%s\n' "$diagnostic"
            exit "$agent_status"
          fi
          commit=$(jq -er '.integratedCommit | select(test("^[0-9a-f]{40}$"))' "$result")
          phase=$(jq -er '.phase' "$result")
          model=$(jq -er '.model | select(test("^[a-zA-Z0-9._-]+$"))' "$result")
          printf 'Copilot model: `%s`\n' "$model" >> "$GITHUB_STEP_SUMMARY"
          git merge-base --is-ancestor "$GITHUB_SHA" "$commit"
          git --no-pager diff --no-ext-diff --no-textconv --binary "$GITHUB_SHA" "$commit" -- > "$RUNNER_TEMP/feature.patch"
          if [[ ! -s "$RUNNER_TEMP/feature.patch" ]]; then
            reason='The candidate has no changes against the run base. Check whether the feature already exists or an acceptance criterion is not implemented.'
            printf 'diagnostic=%s\n' "$reason" >> "$GITHUB_OUTPUT"
            printf '::error title=No PR-ready diff::%s\n' "$reason"
            exit 1
          fi
          [[ "$phase" == awaiting-human-acceptance ]]
          attempt=$(jq -er '.repass | select(type == "number" and . >= 0 and . == floor)' "$result")
          preview="$AGENT_LOOP_UX_EVIDENCE_ROOT/attempt-$attempt.png"
          if [[ -s "$preview" ]]; then
            if [[ -f "$preview" && ! -L "$preview" && $(stat -c '%s' -- "$preview") -le 10485760 ]] &&
                [[ $(od -An -N8 -tx1 -- "$preview" | tr -d '[:space:]') == 89504e470d0a1a0a ]] &&
                install -m 0644 -- "$preview" "$RUNNER_TEMP/ux-preview.png"; then
              printf 'ux-screenshot=true\n' >> "$GITHUB_OUTPUT"
            else
              echo '::warning::Could not stage a Playwright UX preview as a regular PNG within the 10 MiB limit.'
            fi
          fi
          git --no-pager diff --raw --no-renames -z "$GITHUB_SHA" "$commit" |
            node tools/agent-loop/feature-handoff.mjs
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/feature-base-sha.txt"
          printf 'patch=true\ncommit=%s\nphase=%s\n' "$commit" "$phase" >> "$GITHUB_OUTPUT"
          printf 'reviewed-tree=%s\n' "$(git rev-parse "${commit}^{tree}")" >> "$GITHUB_OUTPUT"
      - name: Confirm the issue has not changed before handoff
        id: handoff
        if: steps.agent.outputs.patch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/agent-loop/feature-issue.mjs confirm
      - name: Upload the reviewed patch for maintainers
        id: review
        if: steps.handoff.outputs.approved == 'true' && steps.agent.outputs.phase == 'awaiting-human-acceptance'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: feature-issue-${{ github.event.issue.number }}-review
          path: |
            ${{ runner.temp }}/feature.patch
            ${{ runner.temp }}/feature-base-sha.txt
          if-no-files-found: error
          retention-days: 7
      - name: Upload the Playwright UX screenshot
        id: ux-screenshot
        if: steps.review.outcome == 'success' && steps.agent.outputs.ux-screenshot == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: feature-issue-${{ github.event.issue.number }}-ux-screenshot
          path: ${{ runner.temp }}/ux-preview.png
          if-no-files-found: error
          retention-days: 7
      - name: Package a testable VSIX from the reviewed commit
        id: package
        if: steps.review.outcome == 'success'
        shell: bash
        env:
          REVIEWED_COMMIT: ${{ steps.agent.outputs.commit }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SPE_TEST_CLIENT_ID: ${{ vars.SPE_TEST_CLIENT_ID }}
        run: |
          npm install --prefix "$RUNNER_TEMP/vsce-tool" --ignore-scripts --no-save @vscode/vsce@4.1.1
          source="$RUNNER_TEMP/vsix-source"
          mkdir "$source"
          git archive "$REVIEWED_COMMIT" | tar -xC "$source"
          output="$RUNNER_TEMP/vsix-container-output"
          install -d -m 1777 "$output"
          if ! docker run --rm --pull=never --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --user=1000:1000 --memory=5g --pids-limit=512 \
            --tmpfs /scratch:rw,exec,size=4g,mode=1777 --tmpfs /tmp:rw,exec,size=1g,mode=1777 \
            --mount "type=bind,source=$source,target=/input,readonly" \
            --mount "type=bind,source=$AGENT_LOOP_NPM_CACHE,target=/npm-cache,readonly" \
            --mount "type=bind,source=$PWD/tools/agent-loop/package-feature.mjs,target=/package-feature.mjs,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/vsce-tool,target=/vsce,readonly" \
            --mount "type=bind,source=$output,target=/output" \
            --env HOME=/scratch --env CI=true --env SPE_TEST_CLIENT_ID \
            --entrypoint /bin/bash "$AGENT_LOOP_VALIDATION_IMAGE" -euo pipefail -c '
              mkdir /scratch/project
              tar -C /input -cf - . | tar -C /scratch/project -xf -
              cd /scratch/project
              export npm_config_cache=/scratch/npm-cache
              mkdir "$npm_config_cache"
              cp -R /npm-cache/_cacache "$npm_config_cache/"
              npm ci --ignore-scripts --offline --no-audit --no-fund
              npm ci --prefix webview-ui --ignore-scripts --offline --no-audit --no-fund
              node /package-feature.mjs "$1" "$2" /vsce/node_modules/@vscode/vsce/vsce /output
            ' spe-vsix "$ISSUE_NUMBER" "$REVIEWED_COMMIT" > "$RUNNER_TEMP/feature-vsix-build.log" 2>&1; then
            echo '::error::The isolated VSIX build failed. Check the reviewed patch and whether its lockfiles can be installed from the base dependency cache.'
            exit 1
          fi
          file="spe-issue-${ISSUE_NUMBER}-${REVIEWED_COMMIT:0:12}-testable.vsix"
          [[ -f "$output/$file" && ! -L "$output/$file" && -s "$output/$file" ]]
          mkdir "$RUNNER_TEMP/testable-vsix"
          cp -- "$output/$file" "$RUNNER_TEMP/testable-vsix/$file"
          cd "$RUNNER_TEMP/testable-vsix"
          unzip -tq "$file"
          entries=$(unzip -Z1 "$file")
          for required in extension/package.json extension/out/extension.js extension/out/mcp/launcher.cjs extension/out/webviewApp/index.html; do
            if ! grep -Fxq "$required" <<< "$entries"; then
              echo "::error::The testable VSIX is missing $required."
              exit 1
            fi
          done
          sha256sum "$file" > "$file.sha256"
          printf 'filename=%s\n' "$file" >> "$GITHUB_OUTPUT"
      - name: Upload testable VSIX
        id: vsix
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spe-issue-${{ github.event.issue.number }}-testable-vsix
          path: |
            ${{ runner.temp }}/testable-vsix/${{ steps.package.outputs.filename }}
            ${{ runner.temp }}/testable-vsix/${{ steps.package.outputs.filename }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: implement
    if: needs.implement.outputs.vsix-url != '' && needs.implement.outputs.artifact-id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: feature-publish-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: read
      pull-requests: write
    outputs:
      branch-pushed: ${{ steps.publish.outputs.branch-pushed }}
      branch-commit: ${{ steps.publish.outputs.branch-commit }}
      pr-number: ${{ steps.publish.outputs.pr-number }}
      pr-policy-blocked: ${{ steps.publish.outputs.pr-policy-blocked }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.implement.outputs.artifact-id }}
          path: ${{ runner.temp }}/feature-review
          merge-multiple: true
      - name: Publish draft PR from the reviewed patch
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
          FEATURE_REQUEST_APPROVERS: ${{ vars.FEATURE_REQUEST_APPROVERS }}
          TESTABLE_VSIX_URL: ${{ needs.implement.outputs.vsix-url }}
          REVIEWED_TREE: ${{ needs.implement.outputs.reviewed-tree }}
        run: node tools/agent-loop/publish-feature.mjs "$RUNNER_TEMP/feature-review"

  publish-ux-preview:
    needs: implement
    if: needs.implement.outputs.ux-screenshot-id != '' && needs.implement.outputs.vsix-id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: feature-ux-preview-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      issues: read
    outputs:
      commit: ${{ steps.preview.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: feature-issue-${{ github.event.issue.number }}-ux-screenshot
          path: ${{ runner.temp }}/feature-ux-input
      - name: Confirm approval before publishing the public screenshot
        id: approval
        env:
          GH_TOKEN: ${{ github.token }}
          FEATURE_REQUEST_APPROVERS: ${{ vars.FEATURE_REQUEST_APPROVERS }}
        run: node tools/agent-loop/feature-issue.mjs confirm
      - name: Publish the PNG to the issue's preview branch
        id: preview
        if: steps.approval.outputs.approved == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          image="$RUNNER_TEMP/feature-ux-input/ux-preview.png"
          [[ -f "$image" && ! -L "$image" && $(stat -c '%s' -- "$image") -le 10485760 ]]
          [[ $(od -An -N8 -tx1 -- "$image" | tr -d '[:space:]') == 89504e470d0a1a0a ]]
          scratch=$(mktemp -d "$RUNNER_TEMP/feature-ux-git.XXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          git -C "$scratch" init --quiet
          cd "$scratch"
          ref="refs/heads/feature-agent-preview/issue-$ISSUE_NUMBER"
          upstream="https://github.com/$GITHUB_REPOSITORY.git"
          remote=$(git ls-remote --refs "$upstream" "$ref")
          previous=${remote%%$'\t'*}
          if [[ -n "$remote" ]]; then
            [[ "$previous" =~ ^[a-f0-9]{40}$ && "$remote" == "$previous"$'\t'"$ref" ]]
            git fetch --quiet --depth=1 --no-tags "$upstream" "$previous"
            previous_run=$(git show -s --format=%s "$previous")
            [[ "$previous_run" =~ ^Preview\ run\ ([1-9][0-9]*)$ ]]
            if (( BASH_REMATCH[1] > GITHUB_RUN_ID )); then
              echo 'A newer screenshot is already published; skipping this preview.'
              exit 0
            fi
          fi
          install -m 0644 -- "$image" ux-preview.png
          git -c core.hooksPath=/dev/null add -- ux-preview.png
          git -c core.hooksPath=/dev/null -c user.name='SPE Feature Agent' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "Preview run $GITHUB_RUN_ID"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push --no-verify "--force-with-lease=$ref:$previous" "$upstream" "HEAD:$ref"
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  report-handoff:
    needs: [report-progress, implement, publish, publish-ux-preview]
    if: ${{ always() && github.run_attempt == 1 && needs.implement.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Update the issue with feature delivery and human review status
        env:
          GH_TOKEN: ${{ github.token }}
          FEATURE_REQUEST_APPROVERS: ${{ vars.FEATURE_REQUEST_APPROVERS }}
          IMPLEMENT_RESULT: ${{ needs.implement.result }}
          IMPLEMENT_APPROVED: ${{ needs.implement.outputs.approved }}
          AGENT_STAGE: ${{ needs.implement.outputs.agent-stage }}
          WORKER_RETRIES: ${{ needs.implement.outputs.worker-retries }}
          OFFLINE_PLANS: ${{ needs.implement.outputs.offline-plans }}
          AGENT_DIAGNOSTIC: ${{ needs.implement.outputs.agent-diagnostic }}
          PATCH_ARTIFACT_ID: ${{ needs.implement.outputs.artifact-id }}
          VSIX_ARTIFACT_ID: ${{ needs.implement.outputs.vsix-id }}
          UX_SCREENSHOT_COMMIT: ${{ needs.publish-ux-preview.outputs.commit }}
          REVIEW_FILES: ${{ needs.implement.outputs.review-files }}
          BRANCH_PUSHED: ${{ needs.publish.outputs.branch-pushed }}
          BRANCH_COMMIT: ${{ needs.publish.outputs.branch-commit }}
          DRAFT_PR_NUMBER: ${{ needs.publish.outputs.pr-number }}
          PR_POLICY_BLOCKED: ${{ needs.publish.outputs.pr-policy-blocked }}
        run: node tools/agent-loop/feature-handoff.mjs report
