name: Feature Request Intake

on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions: {}

jobs:
  triage:
    if: >-
      startsWith(github.event.issue.title, 'Feature-Request: SPE VSC Extension -') &&
      (github.event.action != 'labeled' || github.event.label.name == 'agent-ready')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Label incomplete requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/agent-loop/feature-issue.mjs triage

  implement:
    needs: triage
    if: github.event.action == 'labeled' && github.event.label.name == 'agent-ready' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: feature-agent-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
    environment: feature-agent
    outputs:
      artifact-id: ${{ steps.review.outputs.artifact-id }}
    env:
      FEATURE_REQUEST_APPROVERS: ${{ vars.FEATURE_REQUEST_APPROVERS }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authorize issue and compile its task contract
        id: intake
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/agent-loop/feature-issue.mjs authorize
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.intake.outputs.approved == 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare the locked project dependencies, Copilot CLI and validation image
        if: steps.intake.outputs.approved == 'true'
        run: |
          npm ci --ignore-scripts
          npm ci --prefix webview-ui
          npm run agent:build
          npm install --global @github/copilot@1.0.114-0
          playwright_version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          if [[ "$playwright_version" != '1.61.1' ]]; then
            echo '::error::Update the validation image pin to match the Playwright lockfile.'
            exit 1
          fi
          image="mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48"
          docker pull "$image"
          docker image inspect --format 'AGENT_LOOP_VALIDATION_IMAGE={{.Id}}' "$image" >> "$GITHUB_ENV"
          git config user.name "SPE Feature Agent"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Recheck approval before implementation
        id: start
        if: steps.intake.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/agent-loop/feature-issue.mjs confirm
      - name: Run the agent loop and export the reviewed diff
        id: agent
        if: steps.start.outputs.approved == 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [[ -z "$COPILOT_GITHUB_TOKEN" ]]; then
            echo '::error::Configure COPILOT_GITHUB_TOKEN in the feature-agent environment.'
            exit 1
          fi
          if [[ ! "${AGENT_LOOP_VALIDATION_IMAGE:-}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo '::error::The isolated validation image is unavailable.'
            exit 1
          fi
          result="$RUNNER_TEMP/feature-agent-result.json"
          if ! node tools/agent-loop/dist/cli.js run .agent-runs/github-intake-contract.json > "$result" 2> "$RUNNER_TEMP/feature-agent-errors.log"; then
            echo '::error::The agent loop did not finish in its review-ready state. Review the request and Copilot configuration before reapplying agent-ready.'
            exit 1
          fi
          commit=$(jq -er '.integratedCommit | select(test("^[0-9a-f]{40}$"))' "$result")
          git merge-base --is-ancestor "$GITHUB_SHA" "$commit"
          git --no-pager diff --no-ext-diff --no-textconv --binary "$GITHUB_SHA" "$commit" -- > "$RUNNER_TEMP/feature.patch"
          if [[ ! -s "$RUNNER_TEMP/feature.patch" ]]; then
            echo '::warning::The agent returned no changes. No patch will be uploaded.'
            exit 0
          fi
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/feature-base-sha.txt"
          echo 'patch=true' >> "$GITHUB_OUTPUT"
      - name: Confirm the issue has not changed before handoff
        id: handoff
        if: steps.agent.outputs.patch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/agent-loop/feature-issue.mjs confirm
      - name: Upload the reviewed patch for maintainers
        id: review
        if: steps.handoff.outputs.approved == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: feature-issue-${{ github.event.issue.number }}-review
          path: |
            ${{ runner.temp }}/feature.patch
            ${{ runner.temp }}/feature-base-sha.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: implement
    if: needs.implement.outputs.artifact-id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: feature-publish-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.implement.outputs.artifact-id }}
          path: ${{ runner.temp }}/feature-review
          merge-multiple: true
      - name: Publish draft PR from the reviewed patch
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
          FEATURE_REQUEST_APPROVERS: ${{ vars.FEATURE_REQUEST_APPROVERS }}
        run: node tools/agent-loop/publish-feature.mjs "$RUNNER_TEMP/feature-review"
