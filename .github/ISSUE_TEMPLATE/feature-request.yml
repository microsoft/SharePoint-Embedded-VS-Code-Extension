name: SPE VS Code extension feature request
description: Request a feature or improvement to the SharePoint Embedded extension.
title: "Feature-Request: SPE VSC Extension - "
body:
  - type: markdown
    attributes:
      value: This issue is public and reviewed by Copilot. Do not include internal links, customer or tenant data, credentials, or confidential roadmap details. If the reviewer asks for more detail, edit this issue description to trigger another review.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Identify the affected user, what they are trying to do, and the current obstacle.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected behavior
      description: Describe the trigger, expected outcome, relevant failure cases, and anything explicitly out of scope.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: List pass/fail outcomes as Markdown bullets or checkboxes, one per line. Include the conditions and what a tester should observe.
      placeholder: "- When no container is selected, the action is disabled."
    validations:
      required: true
  - type: textarea
    id: ui
    attributes:
      label: UI impact
      description: >-
        Name the screen, the action, and what should visibly change, or enter "None".
        Screenshots are embedded when a webview or desktop VS Code test verifies and
        captures that state with mock data. Native editor tabs and notifications need
        a desktop scenario. API-only changes do not produce a screenshot.
    validations:
      required: true
